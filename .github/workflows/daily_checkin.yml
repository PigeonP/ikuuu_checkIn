name: iKuuu 每日自动签到

on:
  schedule:
    # UTC 23:10 = 北京时间次日 07:10（GitHub cron 使用 UTC）
    - cron: '10 23 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: '手动触发原因（可选）'
        required: false
        default: 'manual'

# 定时任务只需要读取仓库，不需要写权限
permissions:
  contents: read

# 避免多次签到任务并发（同一时刻只跑一个，排队执行）
concurrency:
  group: ikuuu-checkin
  cancel-in-progress: false

jobs:
  checkin:
    name: 执行签到
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 判断签到模式
        id: mode
        env:
          IKUUU_COOKIE: ${{ secrets.IKUUU_COOKIE }}
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
        run: |
          set -e
          if [ -n "${IKUUU_COOKIE}" ]; then
            echo "cookie=true" >> "$GITHUB_OUTPUT"
            echo "签到模式：Cookie 免密直签"
          elif [ -n "${ACCOUNTS}" ]; then
            echo "cookie=false" >> "$GITHUB_OUTPUT"
            echo "签到模式：账号密码 + Playwright 登录"
          else
            echo "::error::未配置 IKUUU_COOKIE 或 ACCOUNTS，请在 Settings → Secrets and variables → Actions 中添加后重试"
            exit 1
          fi

      - name: 安装依赖（Cookie 免密模式，仅需 requests）
        if: steps.mode.outputs.cookie == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 安装依赖（账号密码模式，需 Playwright）
        if: steps.mode.outputs.cookie == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install --with-deps chromium

      - name: 执行签到
        env:
          IKUUU_COOKIE: ${{ secrets.IKUUU_COOKIE }}
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          IKUUU_DOMAIN: ${{ secrets.IKUUU_DOMAIN }}
          # 推送通知（按需配置，未配置则仅输出日志）
          WECHAT_WORK: ${{ secrets.WECHAT_WORK }}
          WX_WEBHOOK: ${{ secrets.WX_WEBHOOK }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python sign_ikuuu.py

      - name: 汇总
        if: always()
        run: |
          echo "本次签到流程结束，作业状态：${{ job.status }}"
          echo "触发方式：${{ github.event_name }}"
          echo "若状态为 failure，请查看上方「执行签到」步骤日志。"
